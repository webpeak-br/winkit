name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path src -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $r | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize -Wrap
          if ($r) { throw "$($r.Count) aviso(s) do PSScriptAnalyzer" }
      - name: UTF-8 com BOM
        shell: pwsh
        run: |
          $bad = Get-ChildItem src, tests -Recurse -Include *.ps1, *.psm1, *.psd1 | Where-Object {
            $b = [IO.File]::ReadAllBytes($_.FullName); -not ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF) }
          if ($bad) { $bad.FullName; throw 'Arquivos sem BOM (o PowerShell 5.1 lê acentos errado sem ele)' }

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
        shell: [powershell, pwsh]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Pester (${{ matrix.shell }} em ${{ matrix.os }})
        shell: pwsh
        run: ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File ./tests/run.ps1
      - name: Diagnóstico real nesta máquina (fumaça)
        shell: pwsh
        run: |
          ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -Command "`$env:WINKIT_DATA = '$env:RUNNER_TEMP\winkit'; Import-Module ./src/WinKit/WinKit.psd1; `$o = Invoke-WinKit -Module Health -NoReport; `$o.Results | Format-Table Status, Check, Message -AutoSize -Wrap | Out-String -Width 200; if (-not `$o.Results.Count) { exit 1 }"
