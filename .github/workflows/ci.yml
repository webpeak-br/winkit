name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path src -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $r | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize -Wrap
          if ($r) { throw "$($r.Count) aviso(s) do PSScriptAnalyzer" }
      - name: UTF-8 com BOM
        shell: pwsh
        run: |
          $bad = Get-ChildItem src, tests -Recurse -Include *.ps1, *.psm1, *.psd1 | Where-Object {
            $b = [IO.File]::ReadAllBytes($_.FullName); -not ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF) }
          if ($bad) { $bad.FullName; throw 'Arquivos sem BOM (o PowerShell 5.1 lê acentos errado sem ele)' }

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
        shell: [powershell, pwsh]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Pester (${{ matrix.shell }} em ${{ matrix.os }})
        shell: ${{ matrix.shell }}
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module Pester -MinimumVersion 5.5.0
          $c = New-PesterConfiguration
          $c.Run.Path = 'tests'
          $c.Run.Exit = $true
          $c.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $c
      - name: Diagnóstico real nesta máquina (fumaça)
        shell: ${{ matrix.shell }}
        run: |
          $env:WINKIT_DATA = "$env:RUNNER_TEMP\winkit"
          Import-Module ./src/WinKit/WinKit.psd1
          $out = Invoke-WinKit -Module Health -NoReport
          $out.Results | Format-Table Status, Check, Message -AutoSize -Wrap
          if (-not $out.Results.Count) { throw 'Health não devolveu resultados' }
